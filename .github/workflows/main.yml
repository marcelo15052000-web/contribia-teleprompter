name: Build APK

# Se ejecuta automáticamente al hacer push a main, o manualmente
# desde la pestaña "Actions" de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (última versión estable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Diagnóstico — versión de Flutter instalada
        run: flutter --version

      - name: Aceptar licencias del Android SDK (por si se necesita descargar Platform 36)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generar carpeta android/ (siempre desde cero, para no arrastrar configuraciones viejas)
        run: |
          rm -rf android
          flutter create --platforms=android --org com.contribia --project-name contribia_teleprompter .

      - name: Aplicar permisos personalizados (cámara, micrófono, etc.)
        run: cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Aplicar ícono real de Contribia (launcher + adaptive icon)
        run: cp -r android_config/res/. android/app/src/main/res/

      - name: Forzar compileSdk/targetSdk 36 en el módulo de la app
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Parcheando $f"
              sed -i -E 's/^([[:space:]]*)compileSdkVersion .*/\1compileSdkVersion 36/' "$f"
              sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$f"
              sed -i -E 's/^([[:space:]]*)targetSdkVersion .*/\1targetSdkVersion 36/' "$f"
              sed -i -E 's/^([[:space:]]*)targetSdk[[:space:]]*=.*/\1targetSdk = 36/' "$f"
              echo "--- Resultado ---"
              grep -E "compileSdk|targetSdk" "$f" || true
            fi
          done

      - name: Instalar dependencias
        run: flutter pub get

      - name: Forzar compileSdk/targetSdk 36 directamente en los plugins descargados (pub-cache)
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Buscando build.gradle(.kts) de plugins en: $PUB_CACHE_DIR"
          FILES=$(find "$PUB_CACHE_DIR" \( -path "*/android/build.gradle" -o -path "*/android/build.gradle.kts" \) 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "⚠️ No se encontraron archivos en $PUB_CACHE_DIR, probando $HOME/.pub-cache como respaldo…"
            FILES=$(find "$HOME/.pub-cache" \( -path "*/android/build.gradle" -o -path "*/android/build.gradle.kts" \) 2>/dev/null)
          fi
          echo "$FILES" | while read -r f; do
            [ -z "$f" ] && continue
            echo "Parcheando: $f"
            sed -i -E 's/^([[:space:]]*)compileSdkVersion .*/\1compileSdkVersion 36/' "$f"
            sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$f"
            sed -i -E 's/^([[:space:]]*)targetSdkVersion .*/\1targetSdkVersion 36/' "$f"
            sed -i -E 's/^([[:space:]]*)targetSdk[[:space:]]*=.*/\1targetSdk = 36/' "$f"
          done
          echo "--- Verificación: valores de compileSdk/targetSdk que quedaron en el pub-cache ---"
          find "$PUB_CACHE_DIR" "$HOME/.pub-cache" \( -path "*/android/build.gradle" -o -path "*/android/build.gradle.kts" \) -exec grep -H -E "compileSdk|targetSdk" {} \; 2>/dev/null | sort -u

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: contribia-teleprompter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
